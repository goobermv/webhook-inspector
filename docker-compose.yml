services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://webhook:webhook@postgres:5432/webhook?sslmode=disable
      - ADMIN_API_KEY=dev-admin-key-change-me
      - HTTP_ADDR=:8080
      - DEFAULT_BIN_MAX_REQUESTS=1000
      - RETENTION_HOURS=24
      - RATE_LIMIT_PER_MINUTE=120
      - ALLOW_PRIVATE_TARGETS=true
      - MIGRATIONS_DIR=file:///migrations
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: