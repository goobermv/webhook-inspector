name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: webhook, POSTGRES_PASSWORD: webhook, POSTGRES_DB: webhook }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go vet ./...
      - run: go test ./... -race
        env:
          DATABASE_URL: postgres://webhook:webhook@localhost:5432/webhook?sslmode=disable